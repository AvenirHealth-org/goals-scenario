[project]
name = "avenir-goals-scenario"
version = "0.0.16"
description = "Goals scenario analysis"
authors = [{ name = "Rob Ashton", email = "rashton@avenirhealth.org" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.11,<=4.00"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "orjson>=3.11.7",
    "numpy>=2.4.4",
    "pyarrow>=23.0.1",
    "pandas>=3.0.3",
    "loguru>=0.7.3",
    "avenir-spectrum-common>=0.1.16",
    "leapfrog-goals>=0.0.9",
    "avenir-spectrum-import-pjnz>=0.1.9",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
goals-scenario = "avenir_goals_scenario.cli:main"

[project.urls]
Homepage = "https://avenirhealth-org.github.io/goals-scenario/"
Repository = "https://github.com/avenirhealth-org/goals-scenario"
Documentation = "https://avenirhealth-org.github.io/goals-scenario/"

[build-system]
requires = ["uv_build>=0.11.1,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "tox-uv>=1.35.1",
    "ty>=0.0.23",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.5",
    "mkdocstrings[python]>=1.0.3",
    "pip-audit>=2.10.1",
    "pyinstaller>=6.20.0",
]

[tool.ty.environment]
python = "./.venv"
python-version = "3.14"

# [tool.uv.sources]
# avenir-spectrum-common = { path = "C:\\Proj\\Spectrum\\SpectrumCommon", editable = true }
# avenir-spectrum-import-pjnz = { path = "C:\\Proj\\Spectrum\\Tools\\ImportPJNZ", editable = true }
# leapfrog-goals = { path = "C:\\Proj\\leapfrog\\goals", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the project root on sys.path so `from tests.conftest import ...` resolves
# regardless of how pytest is launched (`uv run pytest` as well as `python -m pytest`).
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true
# Exclude vendored SpectrumEngine directories
exclude = [
    "src/avenir_goals_scenario/_const",
    "src/avenir_goals_scenario/_import",
    "src/avenir_goals_scenario/_leapfrog"
]

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["S607"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true
exclude_also = [
    # 1. Comments to turn coverage on and off:
    'no cover: start(?s:.)*?no cover: stop',
    # 2. A pragma comment that excludes an entire file:
    '\A(?s:.*# pragma: exclude file.*)\Z',
]

[tool.coverage.run]
branch = true
source = ["src"]
